# Main Hydra config. Override anything from the CLI, e.g.
#   uv run train training.epochs=3 training.lr=5e-4 model.dropout=0.3
defaults:
  - model: vgg1d
  - training: default
  - _self_

seed: 42

data:
  raw_dir: data/raw              # ptbdb_normal.csv + ptbdb_abnormal.csv (pulled with DVC)
  processed_dir: data/processed  # train/val/test .npz files written by prepare-data
  val_size: 0.15                 # fractions of the full dataset
  test_size: 0.15

model_out: models/ecg_vgg1d.pt   # best checkpoint (state_dict + model config)

evaluation:
  threshold: 0.5                 # sigmoid probability above which a beat is "abnormal"
  reports_dir: reports           # metrics.json and figures/ go here

samples:                         # `uv run make-samples`: example beats for `uv run predict`
  out_dir: samples               # example_beats.csv (+ label) and example_beats_unlabeled.csv
  n_per_class: 5                 # normal and abnormal beats each, drawn from the TEST split
  demo_size: 500                 # demo_beats_500.csv: random test beats for the web page
  seed: 42

predict:                         # `uv run predict input=... plot=true` (short keys work too)
  input: samples/example_beats.csv  # CSV with 187 (unlabeled) or 188 (labeled) columns
  model_source: local            # local: the checkpoint at model_out | mlflow: model registry
  model_version: latest          # registry version when model_source=mlflow (e.g. 8)
  output: reports/predictions.csv
  plot: false                    # also save a grid of the waveforms
  figure: reports/figures/example_beats.png

tracking:
  mlflow:
    enabled: true
    tracking_uri: http://localhost:5000
    experiment_name: ecgops
    registered_model_name: ecg-vgg1d
    connect_timeout: 10          # seconds to wait for the server before skipping MLflow
  wandb:
    enabled: false
    project: ecgops
