[project]
name = "ecgops"
version = "0.1.0"
description = "MLOps pipeline for detecting abnormal heartbeats from ECG signals"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "hydra-core>=1.3.2",
    "loguru>=0.7.3",
    "matplotlib>=3.11.2",
    "mlflow>=3.17.0",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "torch>=2.14.1",
]

[project.scripts]
prepare-data = "ecgops.data:main"
train = "ecgops.train:main"
evaluate = "ecgops.evaluate:main"

[dependency-groups]
dev = [
    "dvc[s3]>=3.67.1",
    "mypy",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov",
    "ruff>=0.17.0",
    "snakeviz>=2.2.2",
]
serving = [
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",
]
tuning = [
    "optuna>=5.0.0",
]
wandb = [
    "wandb>=0.31.0",
]
monitoring = [
    "evidently>=0.7.23",
    "great-expectations>=1.24.0",
    "prometheus-client>=0.26.0",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[tool.uv]
package = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["ecgops"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.mypy]
python_version = "3.12"
files = ["src"]
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
check_untyped_defs = true
disallow_incomplete_defs = true
strict_equality = true

# Third-party libraries without type hints (or with partial stubs).
[[tool.mypy.overrides]]
module = ["mlflow.*", "sklearn.*", "hydra.*", "wandb.*", "pandas.*", "matplotlib.*"]
ignore_missing_imports = true
