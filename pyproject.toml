[project]
name = "ecgops"
version = "0.1.0"
description = "MLOps pipeline for detecting abnormal heartbeats from ECG signals"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dvc[s3]>=3.67.1",
    "evidently>=0.7.23",
    "fastapi>=0.143.0",
    "great-expectations>=1.24.0",
    "mlflow>=3.17.0",
    "optuna>=5.0.0",
    "prometheus-client>=0.26.0",
    "torch>=2.14.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
