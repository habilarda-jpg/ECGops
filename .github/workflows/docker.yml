# Build the training and evaluation images (M3/M5). Nothing is pushed to a registry.
#
# The workflow always runs so the "docker build" status check always reports, but the
# builds only happen when files that end up in an image changed (path filter below).
# A trigger-level `paths:` filter would leave a required check pending forever on PRs
# that do not touch those files.
name: docker

on:
  push:
    branches: [main, development, "feature/**", "bugfix/**", "release/**"]
  pull_request:
    branches: [main, development]

permissions:
  contents: read
  pull-requests: read # paths-filter reads the PR's changed files

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: docker build # stable name for the required status check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Did image inputs change?
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            docker:
              - "src/**"
              - "configs/**"
              - "dockerfiles/**"
              - "pyproject.toml"
              - "uv.lock"
              - ".dockerignore"
              - ".github/workflows/docker.yml"

      - name: Skip (no image inputs changed)
        if: steps.changes.outputs.docker != 'true'
        run: echo "No changes under src/, configs/, dockerfiles/, pyproject.toml or uv.lock."

      - name: Set up Docker Buildx
        if: steps.changes.outputs.docker == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build train image
        if: steps.changes.outputs.docker == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: dockerfiles/train.dockerfile
          tags: ecgops-train:ci
          push: false
          load: true # make the image available to `docker run` below
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            GIT_BRANCH=${{ github.head_ref || github.ref_name }}
          cache-from: type=gha,scope=train
          cache-to: type=gha,scope=train,mode=max

      - name: Smoke test train image
        if: steps.changes.outputs.docker == 'true'
        run: |
          docker run --rm ecgops-train:ci --help
          docker run --rm --entrypoint python ecgops-train:ci -c "import ecgops.train, torch; print('ok', torch.__version__)"

      - name: Build evaluate image
        if: steps.changes.outputs.docker == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: dockerfiles/evaluate.dockerfile
          tags: ecgops-evaluate:ci
          push: false
          load: true
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            GIT_BRANCH=${{ github.head_ref || github.ref_name }}
          cache-from: type=gha,scope=evaluate
          cache-to: type=gha,scope=evaluate,mode=max

      - name: Smoke test evaluate image
        if: steps.changes.outputs.docker == 'true'
        run: |
          docker run --rm ecgops-evaluate:ci --help
          docker run --rm --entrypoint python ecgops-evaluate:ci -c "import ecgops.evaluate, mlflow; print('ok', mlflow.__version__)"

      - name: Image sizes
        if: steps.changes.outputs.docker == 'true'
        run: docker image ls "ecgops-*"
